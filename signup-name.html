<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up — Demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <div class="login-card" data-testid="signup-name-form">
      <h1>Create account</h1>

      <div class="field">
        <label for="signupName">Full name</label>
        <input type="text" id="signupName" name="name" data-testid="signup-name-input" autocomplete="off">
      </div>

      <div id="signupNameError" class="field-error" data-testid="signup-name-error"></div>

      <button type="button" class="primary" id="signupNameContinue" data-testid="signup-name-continue">Complete sign up</button>

      <div class="demo-note">
        Step 2 of 2. The email from step 1 travels along as
        <code>?email=</code> in the URL - the same cosmetic trick
        dashboard.html uses for <code>?user=</code> - and is carried
        forward again (with the name) when this step completes.
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
